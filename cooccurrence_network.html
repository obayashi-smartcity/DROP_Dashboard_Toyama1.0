    const n=Math.max(e.n_a,e.n_b), c=e.diff>=0?'240,140,40':'40,110,200', a=Math.min(1,.25+Math.abs(e.diff)/2);
    return {width:1+n*1.0,color:{color:`rgba(${c},${a})`,highlight:`rgb(${c})`},dashes:n<M.ref_n,
      title:`${label(e.s)} × ${label(e.t)}\n${M.seg_a}: n=${e.n_a}人, lift=${e.lift_a??'-'}\n${M.seg_b}: n=${e.n_b}人, lift=${e.lift_b??'-'}\n差（lift）=${e.diff}`};
  }
  const a=Math.min(1,.2+(e.lift||0)/3), strong=e.lift>=M.lift_th;
  return {width:1+e.n*1.0,color:{color:strong?`rgba(200,60,40,${a})`:`rgba(120,120,120,${a})`,highlight:'#c83c28'},
    dashes:e.n<M.ref_n,title:`${label(e.s)} × ${label(e.t)}\nn=${e.n}人（${e.c}投稿）\nlift=${e.lift}\np=${e.p}${e.n<M.ref_n?'\n（参考：n少）':''}`};
}
function render(){
  $('net').style.display=view==='tree'?'none':''; $('tree').style.display=view==='tree'?'block':'none';
  if(view==='tree') return renderTree();
  const edges=getEdges(), seg=isDiff()?'全体':$('seg').value, ninfo=D.nodes[seg]||{}, nodes=new Map();
  edges.forEach(e=>[e.s,e.t].forEach(id=>{ if(nodes.has(id)) return; const k=ninfo[id]||{users:1,posts:1};
    nodes.set(id, id.startsWith('A:')
      ? {id,label:label(id),shape:'box',color:{background:areaColor[label(id)]||'#4e79a7',border:'#234'},font:{color:'#fff',size:15},title:`エリア: ${label(id)}\n${k.posts}投稿・${k.users}人`}
      : {id,label:label(id),shape:'dot',size:8+Math.sqrt(k.users)*3,color:'#f28e2b',title:`指標: ${label(id)}\n該当 ${k.posts}投稿・${k.users}人`});}));
  const vEdges=edges.map((e,i)=>Object.assign({id:i,from:e.s,to:e.t},edgeStyle(e)));
  if(network){network.destroy();network=null;}
  drawLegend();
  if(!edges.length){$('side').innerHTML='<div class="empty">この条件で表示できる関係はありません</div>';return;}
  network=new vis.Network($('net'),{nodes:[...nodes.values()],edges:vEdges},{
    physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-70,springLength:130},stabilization:{iterations:300}},
    interaction:{hover:true,tooltipDelay:100},edges:{smooth:false}});
  network.once('stabilizationIterationsDone',()=>network.setOptions({physics:false}));
  network.on('click',p=>{
    if(p.edges.length&&!p.nodes.length) showEdge(edges[p.edges[0]]);
    else if(p.nodes.length) showNode(p.nodes[0], seg);
  });
}
function drawLegend(){
  let h='<b>ノード</b>：<span class="sw" style="background:#f28e2b;border-radius:50%"></span>指標（大きさ＝該当ユーザー数）　四角＝エリア<br>';
  h+=isDiff()?`<b>線</b>：<span class="sw" style="background:#f08c28"></span>${esc(M.seg_a)}で強い　<span class="sw" style="background:#286ec8"></span>${esc(M.seg_b)}で強い（濃さ＝差の大きさ）<br>`
             :`<b>線</b>：太さ＝n（人）　<span class="sw" style="background:#c83c28"></span>lift≥${M.lift_th}（特徴的）　<span class="sw" style="background:#888"></span>それ以外<br>`;
  h+=`点線＝n<${M.ref_n}（参考）　<span class="ref">lift＝一緒に出た割合が「偶然なら」の何倍か</span>`;
  $('legend').innerHTML=h;
}
function inSeg(pid){ if(!isDiff()&&$('seg').value!=='全体') return D.posts[pid].seg===$('seg').value; return true; }
function hasNode(p,id){ return id.startsWith('A:') ? p.area===label(id) : (label(id) in p.idx); }
function showEdge(e){
  const ids=Object.keys(D.posts).filter(k=>inSeg(k)&&hasNode(D.posts[k],e.s)&&hasNode(D.posts[k],e.t));
  const st=isDiff()?`${esc(M.seg_a)}: n=${e.n_a}人, lift=${e.lift_a??'-'}<br>${esc(M.seg_b)}: n=${e.n_b}人, lift=${e.lift_b??'-'}`
                   :`n=${e.n}人（${e.c}投稿）／ lift=${e.lift} ／ p=${e.p}<br><span class="meta">lift：両方が一緒に出た割合が、無関係な場合の${e.lift}倍</span>`;
  showPosts(ids,`${label(e.s)} × ${label(e.t)}`,st,[e.s,e.t]);
}
function showNode(id,seg){
  const ids=Object.keys(D.posts).filter(k=>inSeg(k)&&hasNode(D.posts[k],id));
  const k=(D.nodes[seg]||{})[id]||{}; showPosts(ids,label(id),`${k.posts??'-'}投稿・${k.users??'-'}人`,[id]);
}
function showPosts(ids,title,stat,focus){
  const f=new Set(focus.filter(x=>x.startsWith('I:')).map(label));
  let h=`<div class="hd">${esc(title)}</div><div class="stat">${stat}<br>投稿 ${ids.length}件を表示</div>`;
  ids.forEach(id=>{const p=D.posts[id];
    const evs=Object.entries(p.idx).filter(([k])=>f.has(k));
    h+=`<div class="card">${p.img?`<img src="${esc(p.img)}" loading="lazy">`:''}
      <div class="meta">${esc(p.u)}｜${esc(p.seg)}｜${esc(p.area)}｜ID:${esc(id)}</div>
      <div>${esc(p.text)}</div>${evs.map(([k,v])=>`<div class="ev"><b>${esc(k)}</b>（score ${v.score}）${v.ev?'：'+esc(v.ev):''}</div>`).join('')}</div>`;});
  $('side').innerHTML=h; $('side').scrollTop=0;
}
function renderTree(){
  const segs=M.segs.filter(s=>s!=='全体'); if(!segs.length) segs.push('全体');
  let h=`<div class="hd">セグメント → エリア → 特徴的に一緒に出る指標（lift≥${M.lift_th}、n≥${M.min_n}）</div><div class="meta">灰色斜体＝n<${M.ref_n}（参考）。指標をクリックすると根拠の投稿を右側に表示</div>`;
  const leaves=[];
  segs.forEach(s=>{
    h+=`<details open><summary><b>${esc(s)}</b>（${M.n_posts[s]}投稿・${M.n_users[s]}人）</summary>`;
    M.areas.forEach(a=>{
      const es=(D.edges[s]||[]).filter(e=>e.kind==='AI'&&e.s==='A:'+a&&e.lift>=M.lift_th).sort((x,y)=>y.lift-x.lift);
      h+=`<details${es.length?' open':''}><summary>${esc(a)}${es.length?'':'　<span class="ref">（特徴的な指標なし）</span>'}</summary>`;
      es.forEach(e=>{leaves.push({e,s});
        h+=`<div class="leaf ${e.n<M.ref_n?'ref':''}"><a href="#" data-i="${leaves.length-1}">${esc(label(e.t))}</a>（n=${e.n}人, lift=${e.lift}）</div>`;});
      h+='</details>';});
    h+='</details>';});
  $('tree').innerHTML=h;
  $('tree').querySelectorAll('a[data-i]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const L=leaves[a.dataset.i];
    const ids=Object.keys(D.posts).filter(k=>D.posts[k].seg===L.s||L.s==='全体').filter(k=>hasNode(D.posts[k],L.e.s)&&hasNode(D.posts[k],L.e.t));
    showPosts(ids,`${L.s}｜${label(L.e.s)} × ${label(L.e.t)}`,`n=${L.e.n}人（${L.e.c}投稿）／ lift=${L.e.lift} ／ p=${L.e.p}`,[L.e.s,L.e.t]);});
}
render();
</script></body></html>
